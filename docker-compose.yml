services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservations_db}
      POSTGRES_USER: ${POSTGRES_USER:-reservations_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservations_password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-reservations_db}
      POSTGRES_USER: ${POSTGRES_USER:-reservations_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservations_password}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-change-me-before-production}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
